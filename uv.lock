    { name = "pyopengl" },
    { name = "pyserial" },
    { name = "pyside6" },
    { name = "pyside6-addons" },
    { name = "pyside6-essentials" },
    { name = "requests" },
    { name = "tomli", marker = "python_full_version < '3.11'" },
]

[package.optional-dependencies]
opengl-accel = [
    { name = "pyopengl-accelerate" },
]

[package.metadata]
requires-dist = [
    { name = "numpy", specifier = ">=1.24.0,<2.0" },
    { name = "pyopengl", specifier = "==3.1.10" },
    { name = "pyopengl-accelerate", marker = "extra == 'opengl-accel'", specifier = "==3.1.10" },
    { name = "pyserial", specifier = ">=3.5" },
    { name = "pyside6", specifier = "==6.8.0.2" },
    { name = "pyside6-addons", specifier = "==6.8.0.2" },
    { name = "pyside6-essentials", specifier = "==6.8.0.2" },
    { name = "requests", specifier = ">=2.31.0" },
    { name = "tomli", marker = "python_full_version < '3.11'", specifier = ">=2.0" },
]
provides-extras = ["opengl-accel"]
